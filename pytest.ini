[pytest]
# Pytest configuration for the asv package + apps.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory to start test discovery.
# The validator/sourcefinder/orchestrator packages were added in Tier 0 — they
# produce every user-visible verdict and previously had no tests at all
# (VALUE_PROPOSITION.md Tier 3.5).
testpaths =
    src/asv/extraction/tests
    src/asv/validator/tests
    src/asv/sourcefinder/tests
    src/asv/orchestrator/tests
    apps/api/tests

# Show extra test summary info
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=asv
    --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for complete workflows
    slow: Tests that take significant time to run
    requires_api: Tests that require API keys

# Minimum Python version
minversion = 3.8

# Coverage settings
[coverage:run]
source = asv
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
